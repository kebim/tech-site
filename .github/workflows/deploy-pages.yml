name: Deploy Tech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pnpm 10 from package.json
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure public site links
        run: |
          cat > .env.production.local << 'EOF'
          VITE_SITE_MODE=tech
          VITE_LEARN_SITE_URL=${{ vars.LEARN_SITE_URL }}
          VITE_TECH_SITE_URL=${{ vars.TECH_SITE_URL }}
          EOF
      - name: Build Tech site
        run: pnpm build
      - name: Verify built Pages files
        run: |
          test -f dist/public/index.html
          find dist/public -maxdepth 2 -type f | head -30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./dist/public
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
